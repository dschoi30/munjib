services:
  web:
    image: ${WEB_DEV_IMAGE:-munjib-web-dev}
    user: "0:0"
    build:
      context: .
      target: dev
    command: pnpm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      MUNJIB_DEPLOYMENT_ENV: ${MUNJIB_DEPLOYMENT_ENV:-development}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://obsidian:obsidian@postgres:5432/obsidian_clone?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET_FILE:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-obsidian-clone-development-secret}
      NEXTAUTH_COOKIE_SECURE: ${NEXTAUTH_COOKIE_SECURE:-false}
      MUNJIB_ENABLE_DEV_LOGIN: ${MUNJIB_ENABLE_DEV_LOGIN:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    secrets: !reset []
