services:
  tools:
    image: ${WEB_IMAGE:?immutable image digest required}
    user: "10001:10001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://munjib_rag@postgres:5432/obsidian_clone?schema=public
      PGPASSFILE: /run/secrets/munjib_rag_credential
      PGOPTIONS: -c search_path=pg_catalog,public,munjib_extensions
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        unset PGUSER PGPASSWORD PGHOST PGPORT PGDATABASE PGSERVICE PGSERVICEFILE PGOPTIONS PGPASSFILE PGSSLMODE PGSSLROOTCERT PGSSLCERT PGSSLKEY PGAPPNAME PGCHANNELBINDING
        export PGOPTIONS='-c search_path=pg_catalog,public,munjib_extensions'
        export PGPASSFILE=/run/secrets/munjib_rag_credential
        exec pnpm run db:rag:index
    secrets:
      - source: munjib_rag_credential
        target: munjib_rag_credential
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:?immutable postgres digest required}
    environment:
      POSTGRES_DB: obsidian_clone
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

secrets:
  munjib_rag_credential:
    file: /etc/munjib/secrets/rag-current
