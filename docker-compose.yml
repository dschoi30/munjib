services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: obsidian
      POSTGRES_DB: obsidian_clone
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian -d obsidian_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://obsidian:obsidian@postgres:5432/obsidian_clone?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-obsidian-clone-development-secret}
    ports:
      - "${WEB_PORT:-3000}:3000"

  tools:
    build:
      context: .
      target: tools
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://obsidian:obsidian@postgres:5432/obsidian_clone?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-obsidian-clone-development-secret}

volumes:
  postgres_data:
