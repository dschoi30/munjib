services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: obsidian
      POSTGRES_DB: obsidian_clone
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian -d obsidian_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://obsidian:obsidian@postgres:5432/obsidian_clone?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-obsidian-clone-development-secret}
      NEXTAUTH_COOKIE_SECURE: ${NEXTAUTH_COOKIE_SECURE:-}
      MUNJIB_OLLAMA_BASE_URL: ${MUNJIB_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MUNJIB_RAG_CHAT_MODEL: ${MUNJIB_RAG_CHAT_MODEL:-gemma4:e4b}
      MUNJIB_RAG_EMBED_MODEL: ${MUNJIB_RAG_EMBED_MODEL:-bge-m3}
      MUNJIB_RAG_EMBED_DIMENSIONS: ${MUNJIB_RAG_EMBED_DIMENSIONS:-1024}
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - web_storage:/app/storage

  tools:
    build:
      context: .
      target: tools
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://obsidian:obsidian@postgres:5432/obsidian_clone?schema=public}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-obsidian-clone-development-secret}
      NEXTAUTH_COOKIE_SECURE: ${NEXTAUTH_COOKIE_SECURE:-}
      MUNJIB_OLLAMA_BASE_URL: ${MUNJIB_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MUNJIB_RAG_CHAT_MODEL: ${MUNJIB_RAG_CHAT_MODEL:-gemma4:e4b}
      MUNJIB_RAG_EMBED_MODEL: ${MUNJIB_RAG_EMBED_MODEL:-bge-m3}
      MUNJIB_RAG_EMBED_DIMENSIONS: ${MUNJIB_RAG_EMBED_DIMENSIONS:-1024}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  web_storage:
