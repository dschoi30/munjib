# Test-only overlay. Never include this file in production Compose commands.
services:
  egress-probe:
    image: node:22-alpine
    profiles: [egress-test]
    # This is a separate container-network listener. Keep the in-process
    # Playwright probe loopback-only; only this explicit overlay override is
    # reachable by the web container through the `egress-probe` alias.
    environment:
      MUNJIB_EGRESS_PROBE_BIND_HOST: 0.0.0.0
    command:
      - node
      - -e
      - >-
        require('node:http').createServer((req,res)=>{res.writeHead(204);res.end()})
        .listen(39158,process.env.MUNJIB_EGRESS_PROBE_BIND_HOST)
    ports:
      - "127.0.0.1:39158:39158"
    networks:
      default:
        aliases: [egress-probe]

  web:
    depends_on:
      egress-probe:
        condition: service_started
    environment:
      MUNJIB_E2E_PROVIDER_TRANSPORT: "true"
      MUNJIB_DEPLOYMENT_ENV: development
      MUNJIB_EGRESS_PROBE_ORIGIN: http://egress-probe:39158
      MUNJIB_EGRESS_PROBE_SERVER_ORIGIN: http://egress-probe:39158
      MUNJIB_E2E_ATTACKER_ORIGIN: http://egress-probe:39158
    networks:
      default:
        aliases: [munjib-web-egress]
