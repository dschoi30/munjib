name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: munjib-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_TAG: ${{ github.sha }}
  PNPM_VERSION: 10.28.1

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://obsidian:obsidian@localhost:5432/obsidian_clone?schema=public
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: obsidian
          POSTGRES_PASSWORD: obsidian
          POSTGRES_DB: obsidian_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obsidian -d obsidian_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Check Next.js advisories
        run: pnpm exec tsx scripts/security/check-next-advisories.ts --candidate "$(node -p "require('./package.json').dependencies.next")"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Go for delivery bundle
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22.12"
          cache: false

      - name: Test Trial edge proof signer
        run: go test -race ./cmd/munjib-trial-edge

      - name: Build and verify Linux ARM64 delivery bundle
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/munjib-delivery-linux-arm64"
          bundle_dir="$RUNNER_TEMP/munjib-delivery-substrate-v1"
          metadata_file="$RUNNER_TEMP/munjib-delivery-substrate-v1.sha256"
          mkdir -p "$artifact_dir"
          for binary in broker submit verify; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
              -trimpath -buildvcs=false -ldflags='-buildid=' \
              -o "$artifact_dir/munjib-release-$binary" \
              "./cmd/munjib-release-$binary"
          done
          pnpm delivery:build-bundle -- "$artifact_dir" "$bundle_dir"
          pnpm delivery:verify-bundle -- "$bundle_dir"
          {
            printf 'target=linux/arm64\n'
            printf 'bundle_format=munjib-delivery-bundle-manifest-v2\n'
            sha256sum \
              "$artifact_dir/munjib-release-broker" \
              "$artifact_dir/munjib-release-submit" \
              "$artifact_dir/munjib-release-verify" \
              "$bundle_dir/manifest.json" \
              "$bundle_dir/bundle.sha256"
          } > "$metadata_file"
          cat "$metadata_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Prepare database
        run: |
          pnpm exec prisma migrate deploy
          pnpm run db:rag:index

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm run build

      - name: Build runtime image
        run: docker build --target runner --tag munjib-ci:${IMAGE_TAG} .

  deploy:
    name: Deploy
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - munjib-production
    needs: ci
    if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: munjib-production
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - name: Deploy exact main SHA
        run: printf '%s\n' "${{ github.token }}" | sudo /usr/local/sbin/munjib-deploy "${{ github.sha }}"
