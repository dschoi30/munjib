name: Production runner smoke

on:
  repository_dispatch:
    types:
      - production-runner-smoke

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.repository.private == true
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - munjib-production
    timeout-minutes: 5
    steps:
      - name: Verify runner identity and outbound health
        run: |
          set -euo pipefail
          test "$(id -un)" = munjib-runner
          test "$(uname -m)" = aarch64
          ! id -nG | tr ' ' '\n' | grep -Fx docker
          curl --fail --silent --show-error --location --max-time 20 https://github.com/ >/dev/null
          curl --fail --silent --show-error --location --max-time 20 https://munjib.example.invalid >/dev/null
